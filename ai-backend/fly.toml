# fly.toml app configuration file generated for context-compiler-python on 2026-04-18T13:24:09-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'context-compiler-python'
primary_region = 'ord'

[build]

[processes]
  app = ".venv/bin/uvicorn main:app --host 0.0.0.0 --port 8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024